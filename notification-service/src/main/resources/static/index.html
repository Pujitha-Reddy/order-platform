<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Platform — Live Dashboard</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem; }
  h1 { font-weight: 600; margin-bottom: 0.25rem; }
  #status { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.9rem; }
  #status.connected { color: #4ade80; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }
  th { color: #94a3b8; font-weight: 500; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
  tr:hover { background: #1e293b; }
  .badge { padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .CREATED { background: #1e3a5f; color: #7dd3fc; }
  .INVENTORY_RESERVED { background: #1e3a2e; color: #86efac; }
  .INVENTORY_FAILED, .PAYMENT_FAILED { background: #3f1d1d; color: #fca5a5; }
  .PAYMENT_COMPLETED { background: #14532d; color: #4ade80; }
  .detail { color: #94a3b8; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>Order Platform — Live Dashboard</h1>
<div id="status">Connecting...</div>
<table>
  <thead>
    <tr><th>Order ID</th><th>Customer</th><th>Product</th><th>Amount</th><th>Status</th><th>Detail</th><th>Updated</th></tr>
  </thead>
  <tbody id="orders"></tbody>
</table>

<script>
  const orders = new Map();
  const tbody = document.getElementById('orders');
  const statusEl = document.getElementById('status');

  function render() {
    tbody.innerHTML = '';
    [...orders.values()]
      .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
      .forEach(o => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${o.orderId.slice(0, 8)}…</td>
          <td>${o.customerId}</td>
          <td>${o.productId}</td>
          <td>$${Number(o.amount).toFixed(2)}</td>
          <td><span class="badge ${o.status}">${o.status.replace(/_/g, ' ')}</span></td>
          <td class="detail">${o.detail || ''}</td>
          <td class="detail">${new Date(o.updatedAt).toLocaleTimeString()}</td>
        `;
        tbody.appendChild(row);
      });
  }

  function connect() {
    const ws = new WebSocket('ws://localhost:8085/ws/orders');

    ws.onopen = () => {
      statusEl.textContent = 'Connected — live updates streaming';
      statusEl.className = 'connected';
    };

    ws.onmessage = (event) => {
      const update = JSON.parse(event.data);
      orders.set(update.orderId, update);
      render();
    };

    ws.onclose = () => {
      statusEl.textContent = 'Disconnected — retrying in 3s...';
      statusEl.className = '';
      setTimeout(connect, 3000);
    };

    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
